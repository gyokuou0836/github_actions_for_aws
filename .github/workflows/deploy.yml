name: deploy

on:
  push:
    branches: [deploy_dev, deploy_stg]   # 将来 deploy_prod を追加
    paths: ["cfn/**", "scripts/**", ".github/workflows/deploy.yml"]
  pull_request:
    branches: [deploy_dev, deploy_stg]
    paths: ["cfn/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        default: dev

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      - name: Lint CloudFormation templates
        run: cfn-lint cfn/s3-bucket.yaml

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 手動実行は選択値、pushはブランチから環境を決定
    environment: ${{ inputs.environment || (github.ref_name == 'deploy_stg' && 'staging') || 'dev' }}
    env:
      TARGET_ENV: ${{ inputs.environment || (github.ref_name == 'deploy_stg' && 'staging') || 'dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install boto3

      - name: Debug OIDC Token Claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
            echo "=== OIDC Token Header & Payload (signature omitted) ==="
            python3 -c "
          import sys, json, base64
          t = sys.argv[1]
          parts = t.split('.')
          def pad(b): return b + '=' * (-len(b) % 4)
          header = json.loads(base64.urlsafe_b64decode(pad(parts[0])))
          payload = json.loads(base64.urlsafe_b64decode(pad(parts[1])))
          print('Header:', json.dumps(header))
          # 重要なクレームのみ出力
          for k in ['iss', 'aud', 'sub', 'repository', 'environment', 'ref', 'actor']:
              print(f'  {k}: {payload.get(k)}')
          " "$TOKEN"
          fi

      - name: Show Expected OIDC Subject
        env:
          OWNER_ID: ${{ github.repository_owner_id }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "=== 信頼ポリシーが必要とする sub (immutable subject) ==="
          if [ -n "$OWNER_ID" ] && [ -n "$REPO_ID" ]; then
            echo "  repo:${OWNER}@${OWNER_ID}/${REPO}@${REPO_ID}:environment:${TARGET_ENV}"
          else
            echo "  repo:<owner>@<owner-id>/<repo>@<repo-id>:environment:${TARGET_ENV}"
          fi
          echo "  ※ 上の Debug ステップの sub と一致しない場合は sts:AssumeRoleWithWebIdentity が失敗します"
          echo "  ※ 手順: iam/README.md"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
      - name: Deploy stack
        run: |
          python scripts/deploy.py \
            --stack-name "s3-practice-${TARGET_ENV}" \
            --template cfn/s3-bucket.yaml \
            --param "BucketName=${{ vars.BUCKET_NAME }}" \
            --param "Environment=${TARGET_ENV}"
